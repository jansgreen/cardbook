<div class="finance-table-wrap">
    <table class="finance-table">
        <thead>
            <tr>
                {% for column in table_columns %}
                    <th>{{ column }}</th>
                {% endfor %}
            </tr>
        </thead>
        <tbody>
            {% for row in table_rows %}
                <tr>
                    {% for cell in row %}
                        <td>{{ cell }}</td>
                    {% endfor %}
                </tr>
            {% empty %}
                <tr>
                    <td colspan="{{ table_columns|length }}">No hay registros disponibles.</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
