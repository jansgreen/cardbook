<div class="access-modal" id="modal-permission" aria-hidden="true">
    <div class="access-modal__backdrop" data-modal-close></div>
    <div class="access-modal__dialog" role="dialog" aria-modal="true">
        <div class="access-modal__head">
            <div>
                <h2>Crear permiso</h2>
                <p>Define una acción específica del sistema.</p>
            </div>
            <button class="access-modal__close" type="button" data-modal-close>×</button>
        </div>

        <form class="dashboard-form access-form" method="post">
            {% csrf_token %}
            <input type="hidden" name="action" value="create_permission">
            {{ permission_form.non_field_errors }}

            <label><span>Código</span>{{ permission_form.code }}{{ permission_form.code.errors }}</label>
            <label><span>Nombre</span>{{ permission_form.name }}{{ permission_form.name.errors }}</label>
            <label><span>Descripción</span>{{ permission_form.description }}{{ permission_form.description.errors }}</label>
            <label class="checkbox-field"><span>Activo</span>{{ permission_form.is_active }}</label>

            <div class="access-modal__actions">
                <button class="access-btn" type="button" data-modal-close>Cancelar</button>
                <button class="access-btn access-btn--primary" type="submit">Crear permiso</button>
            </div>
        </form>
    </div>
</div>
