<div class="access-modal" id="modal-group" aria-hidden="true">
    <div class="access-modal__backdrop" data-modal-close></div>
    <div class="access-modal__dialog" role="dialog" aria-modal="true">
        <div class="access-modal__head">
            <div>
                <h2>Crear grupo</h2>
                <p>Agrupa roles y permisos para asignaciones rápidas.</p>
            </div>
            <button class="access-modal__close" type="button" data-modal-close>×</button>
        </div>

        <form class="dashboard-form access-form" method="post">
            {% csrf_token %}
            <input type="hidden" name="action" value="create_group">
            {{ group_form.non_field_errors }}

            <label><span>Nombre</span>{{ group_form.name }}{{ group_form.name.errors }}</label>
            <label><span>Descripción</span>{{ group_form.description }}{{ group_form.description.errors }}</label>
            <label><span>Roles</span>{{ group_form.roles }}{{ group_form.roles.errors }}</label>
            <label><span>Permisos extra</span>{{ group_form.permissions }}{{ group_form.permissions.errors }}</label>
            <label class="checkbox-field"><span>Activo</span>{{ group_form.is_active }}</label>

            <div class="access-modal__actions">
                <button class="access-btn" type="button" data-modal-close>Cancelar</button>
                <button class="access-btn access-btn--primary" type="submit">Crear grupo</button>
            </div>
        </form>
    </div>
</div>
